			"velocity_base"		"2200.0"	//Base projectile velocity.
			"velocity_bonus"	"600.0"	//Additional velocity to add, proportional to charge amount (EX if this is 600 and the bolt is fired at 50% charge, the bolt will travel at "velocity_base" + 300 HU/s)
			
