"character"
{
	"name"		"Kholdroz"		//The name of this character.
	"class"		"7"						//The character's class, 1-9. Corresponds to the classes in the class select screen, IE 1 is scout, 2 is soldier, 3 is pyro, etc.
	"model"		"models/player/medic.mdl"		//The mdl file to use for this character.
	"health"	"325"		//Character's max health.
	"speed"		"335.0"
	"scale"		"1.0"		//Character's model scale. This affects hitboxes and collision as well. Be careful with making this too big; the feature is programmed so that this is only applied when the player is in a location where they would not get stuck at this scale, but this does not account for characters being too big to get out of the spawn door!
	"weight"	"0.35"		//Percentage by which to reduce knockback, IE 0.3 would grant 30% knockback resistance and -0.3 would grant -30%. This is applied to all weapon-inflicted knockback, including custom damage, so long as a weapon is specified.
	
	"menu_display"		//Determines what to show in the !character menu when selecting this character. Uses the values defined in game_rules if this is left blank.
	{
		"related_class"		"Pyro"			//The TF2 class this character is most related to. Can be anything. If your character is not related to any of the classes to a significant degree, I recommend writing "Wildcard".
		"role"				"DPS"				//This character's role in the roster. Can be anything. I recommend choosing between DPS, Tank, and Support.
		"description"		"Your primary fires a constant, short-ranged stream of cryonic energy, which applies Cryo buildup.\nMelee and M2 deal bonus damage to frozen enemies.\nM2: Fires an ice projectile which can headshot.\nM3: Throw a grenade, which deploys a block of ice."			//A brief description of this character's abilities and intended playstyle.
		"lore_description"	"An extremely powerful and high-ranking Ziberian mage, specializing in magic as cold as his disposition.\nHe is known to be callous and indifferent to the suffering of others, even his own soldiers."			//A description of this character's personality and lore, if wanted.
	
		"desc_detailed"
		{
			"1"		"MELEE - EISBRECHER\n• 80 Base Damage\n• +50%% Range\n• -35%% Swing Speed"
			"2"		"PASSIVE - COLD SNAP\n• Melee attacks against enemies afflicted with Frozen\n  deal double damage, but remove Frozen.\n• If this is lethal: restore a big chunk of mana, then\n  gain mini-crits and a speed boost for 5 seconds."
			"3"		"SPECIAL DEBUFF - CRYO BUILDUP\n• Applied by various sources.\n• Upon reaching 100%%: remove this debuff,\n  then apply Frozen for 6s."
			"4"		"SPECIAL DEBUFF - FROZEN\n• When applied: deal a burst of damage, increased against buildings.\n• Reduces movement and attack speed by 25%%.\n• Increases all damage taken by 20%%.\n• When removed: become immune to Cryo Buildup for 3 seconds."
			"5"		"HOLD M2 - AURORA BEAM\n• Consumes Mana to fire a constant,\n  short-ranged stream of cryonic energy.\n• Applies 60%% Cryo Buildup per second.\n• You cannot swing your melee while\n  firing the Aurora Beam."
			"6"		"HOLD M3 - FROSTBOLT\n• Hold to charge up a frost projectile, release to fire.\n• Deals 30-90 Base Damage.\n• Applies 10%%-35%% Cryo Buildup.\n• Headshots deal 50%% more damage and apply 3x Cryo Buildup.\n• +50%% damage VS Frozen targets."
			"7"		"FROSTBOLT (CONTINUED)\n• You cannot swing your melee or \n  use Aurora Beam while charging."
			"8"		"RELOAD - POLAR PILLAR\n• Toss a frost grenade. On impact, the frost grenade\n  rapidly manifests an ice cube.\n• Enemies who touch the ice cube while it is rising take\n  damage and are knocked back, and also suffer 60%% Cryo Buildup."
			"9"		"POLAR PILLAR (CONTINUED)\n• The ice cube will launch you high up into the air\n  if you are standing on it as it finishes rising.\n• The ice cube persists for up to 8 seconds,\n  and will block enemy attacks and movement."
			"10"		"POLAR PILLAR (CONTINUED)\n• The ice cube can he healed by your primary weapon.\n  This also extends its lifespan."
			"11"	"ULTIMATE ABILITY - POLAR VORTEX\n• Kholdroz slows down and begins channeling his frost magic.\n• After a short delay, he unleashes a frigid cyclone\n  which follows him, rapidly damaging and pulling in\n  nearby enemies."
			"12"	"POLAR VORTEX (CONTINUED)\n• Enemies who are damaged by this attack suffer\n  Absolute Zero Buildup.\n• When Absolute Zero reaches 100%%: the target is\n  encased in ice for 4s, preventing them from\n  moving or attacking."
			"13"	"POLAR VORTEX (CONTINUED)\n• Enemies who are immobilized by Absolute Zero take\n  500%% damage from Eisbrecher (melee), removing the\n  Absolute Zero debuff."
			"14"	"CREDITS\n• Spookmaster: Original Character, Concept, Balancing, Code, Config\n• Nolan North: Voice Actor (voice taken from the Chosen Hunter from XCOM 2: War of the Chosen)"
		}
	}
	
